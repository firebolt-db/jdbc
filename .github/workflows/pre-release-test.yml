name: Pre-release test

on:
  workflow_dispatch:
  workflow_call:
    secrets:
      FIREBOLT_STG_USERNAME:
        required: true
      FIREBOLT_STG_PASSWORD:
        required: true
      FIREBOLT_CLIENT_ID_STG_NEW_IDN:
        required: true
      FIREBOLT_CLIENT_SECRET_STG_NEW_IDN:
        required: true
      ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_ID_STG:
        required: true
      ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_SECRET_STG:
        required: true
      ECOSYSTEM_FIREBOLT_SA_NETWORK_POLICY_CLIENT_ID_STG:
        required: true
      ECOSYSTEM_FIREBOLT_SA_NETWORK_POLICY_CLIENT_SECRET_STG:
        required: true
      FIREBOLT_CORE_DEV_CERT_PRIVATE_KEY:
        required: true
      FIREBOLT_CORE_DEV_CERT:
        required: true

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml

  run-cloud-integration-test:
    needs: build
    permissions:
      contents: write # Allure report is pushed to gh-pages.
      pages: read # Allure report looks up the Pages URL.
      statuses: write # Allure report posts a commit status.
    uses: ./.github/workflows/integration-test.yml
    secrets:
      FIREBOLT_STG_USERNAME: ${{ secrets.FIREBOLT_STG_USERNAME }}
      FIREBOLT_STG_PASSWORD: ${{ secrets.FIREBOLT_STG_PASSWORD }}
      FIREBOLT_CLIENT_ID_STG_NEW_IDN: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
      FIREBOLT_CLIENT_SECRET_STG_NEW_IDN: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
      ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_ID_STG: ${{ secrets.ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_ID_STG }}
      ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_SECRET_STG: ${{ secrets.ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_SECRET_STG }}
      ECOSYSTEM_FIREBOLT_SA_NETWORK_POLICY_CLIENT_ID_STG: ${{ secrets.ECOSYSTEM_FIREBOLT_SA_NETWORK_POLICY_CLIENT_ID_STG }}
      ECOSYSTEM_FIREBOLT_SA_NETWORK_POLICY_CLIENT_SECRET_STG: ${{ secrets.ECOSYSTEM_FIREBOLT_SA_NETWORK_POLICY_CLIENT_SECRET_STG }}

  run-core-integration-tests:
    needs: build
    permissions:
      contents: write # Allure report is pushed to gh-pages.
      pages: read # Allure report looks up the Pages URL.
      statuses: write # Allure report posts a commit status.
      packages: read # Firebolt Core image is pulled from ghcr.io.
    uses: ./.github/workflows/core-integration-test.yml

  run-smoke-test:
    needs: build
    permissions:
      contents: read
      actions: read # Downloads the jar artifact of this run.
    uses: ./.github/workflows/sandbox-smoke-test.yml
    with:
      jdbcJar: ${{ needs.build.outputs.uber-jar }}
      runId: ${{ github.run_id }}
