name: Run performance tests

on:
  workflow_dispatch:
    inputs:
      database:
        description: 'Database (staging) - a new one will be created if not provided'
        required: false
        default: ''
      threads:
        description: 'Number of threads/users'
        required: false
        default: '5'
      loops:
        description: 'Number of iterations for every thread'
        required: false
        default: '50'

permissions: {}

jobs:
  build:
    permissions:
      contents: read
    uses: ./.github/workflows/build.yml
  run-performance-test:
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: write # Results are pushed to the performance-tests-history branch.
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Create dependency folder for JMX
        run: |
          mkdir dependencies
      - name: Download uber-jar
        id: download-jar
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ needs.build.outputs.uber-jar }}
          path: dependencies
      - name: Setup database and engine
        id: setup
        if: ${{ inputs.database == '' }}
        uses: firebolt-db/integration-testing-setup@1feb289e8da573c5f1f74d8ff3cd69bcb5b5891a # v1.0.4
        with:
          firebolt-username: ${{ secrets.FIREBOLT_STG_USERNAME }}
          firebolt-password: ${{ secrets.FIREBOLT_STG_PASSWORD }}
          api-endpoint: "api.staging.firebolt.io"
          region: "us-east-1"
          instance-type: "C2"
          engine-scale: 2

      - name: Determine database name
        id: find-database-name
        env:
          INPUT_DATABASE: ${{ inputs.database }}
          SETUP_DATABASE: ${{ steps.setup.outputs.database_name }}
        run: |
          if ! [[ -z "$INPUT_DATABASE" ]]; then
             echo "database_name=$INPUT_DATABASE" >> "$GITHUB_OUTPUT"
          else
             echo "database_name=$SETUP_DATABASE" >> "$GITHUB_OUTPUT"
          fi

      # The credentials go into a JMeter properties file (loaded with -q) instead of
      # the action's args, which end up on the command line and in the log.
      - name: Write JMeter credentials file
        env:
          JMETER_USERNAME: ${{ secrets.SERVICE_ACCOUNT_ID_STAGING }}
          JMETER_PASSWORD: ${{ secrets.SERVICE_ACCOUNT_SECRET_STAGING }}
        run: |
          umask 077
          # Escape backslashes, which are special in Java properties files.
          {
            echo "username=${JMETER_USERNAME//\\/\\\\}"
            echo "password=${JMETER_PASSWORD//\\/\\\\}"
          } > jmeter-credentials.properties
      - name: Run JMeter Tests
        uses: rbhadti94/apache-jmeter-action@f7da1bc9fee0b7c85b421761fa30a6f3e2b95647 # v0.7.0
        with:
          testFilePath: JDBC.jmx
          dependencyFolder: dependencies
          outputReportsFolder: reports/
          args: -q jmeter-credentials.properties -Jdatabase=${{ steps.find-database-name.outputs.database_name }} -Jdriver=${{ needs.build.outputs.uber-jar }} -Jenvironment=staging -Jthreads=${{ inputs.threads }} -Jloops=${{ inputs.loops }}
      - name: Delete JMeter credentials file
        if: always()
        run: rm -f jmeter-credentials.properties
      - name: Upload JMeter report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: performance_test_report
          path: reports
      - name: Upload JMeter logs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: jmeter_log.log
          path: jmeter_log.log
      - name: Get short commit SHA
        id: short-sha
        run: echo "short_sha=$(git rev-parse --short HEAD)" >> "$GITHUB_OUTPUT"
      - name: Extract test summary
        id: summary
        env:
          THREADS: ${{ inputs.threads }}
          SHORT_SHA: ${{ steps.short-sha.outputs.short_sha }}
        run: |
          result="$(date +"%d-%m-%y %T %Z"),${THREADS},$(jq -r '.Total.sampleCount, .Total.errorCount, .Total.errorPct, .Total.meanResTime, .Total.medianResTime, .Total.minResTime, .Total.maxResTime, .Total.pct1ResTime, .Total.pct2ResTime, .Total.pct3ResTime, .Total.throughput | round' reports/statistics.json| tr '\n' '|' | sed 's/|$/\n/'),${SHORT_SHA},$GITHUB_REF"
          echo "SUMMARY=$(echo "$result" | tr '|' ',')" >> "$GITHUB_OUTPUT"
          sudo rm -rf "/home/runner/work/jdbc/jdbc/reports"
      - name: Checkout history branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: performance-tests-history
          persist-credentials: true # The push step commits to the history branch.
      - name: Append history with test summary
        env:
          SUMMARY: ${{ steps.summary.outputs.summary }}
        run: |
          echo "$SUMMARY" >> results.csv
      - name: push
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7.2.0
        with:
          commit_message: Push history
          branch: performance-tests-history
      - name: Publish results
        run: |
          chmod u+x export_performance_tests_results.sh
          {
            echo "### :rocket: Tests Results :rocket:"
            echo "| Date  | Thread count  | Sample count  | Error count | Error % | Mean response time |Median response time | Min response time | Max response time | 1st percentile response time | 2nd percentile response time | 3nd percentile response time | Throughput | Commit | Branch"
            echo "| -------------  | -------------  | -------------  | ------------- | ------------- | ------------- | ------------- | ------------- | ------------- | ------------- | ------------- | ------------- | ------------- | ------------- | ------------- |"
          } >> "$GITHUB_STEP_SUMMARY"
          ./export_performance_tests_results.sh
