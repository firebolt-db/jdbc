name: Core integration tests

on:
  workflow_dispatch:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
      java_version:
        description: 'JRE version'
        required: false
        type: string
        default: '11'
      os_name:
        description: 'The operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
      sendSlackNotifications:
        description: 'Send Slack notifications on failure'
        required: false
        type: boolean
        default: false
      use-cache:
        description: 'Use the Gradle cache (the release path passes false)'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      tag_version:
        description: 'The docker image tag for the firebolt core'
        required: false
        type: string
      java_version:
        description: 'Java'
        required: false
        type: string
        default: '11'
      os_name:
        description: 'Operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
      sendSlackNotifications:
        description: 'Send Slack notifications on failure'
        required: false
        type: boolean
        default: false
      use-cache:
        description: 'Use the Gradle cache (the release path passes false)'
        required: false
        type: boolean
        default: true
    secrets:
      SLACK_BOT_TOKEN:
        required: false

permissions: {}

jobs:
  run-core-integration-tests:
    runs-on: ${{ inputs.os_name }}
    permissions:
      contents: write # Allure report is pushed to gh-pages.
      pages: read # Allure report looks up the Pages URL.
      statuses: write # Allure report posts a commit status.
      packages: read # Firebolt Core image is pulled from ghcr.io.
    steps:
      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java_version }}
          cache: ${{ inputs.use-cache && 'gradle' || '' }}

      - name: Setup Firebolt Core
        id: setup-core
        uses: firebolt-db/action-setup-core@5adec87419b62523e77ca1a1affe9411809738a5 # v1.1.0
        with:
          tag_version: ${{ inputs.tag_version || vars.DEFAULT_CORE_IMAGE_TAG }}

      - name: Grant execute permission (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Run integration tests
        run: ./gradlew integrationTest -DincludeTags="core" -Ddb=integration_test_db --info
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Allure Report
        uses: firebolt-db/action-allure-report@8cdc116f65f6eca845a992e347e72b75ca8ccf5f # v2.1.1
        if: always() && runner.os == 'Linux' # Needed in order to report failed tests
        with:
            github-key: ${{ secrets.GITHUB_TOKEN }}
            test-type: core
            allure-dir: build/allure-results
            pages-branch: gh-pages
            keep-files: true

      - name: Slack Notify of failure
        if: failure() && inputs.sendSlackNotifications
        uses: firebolt-db/action-slack-nightly-notify@1bdd915837fbe0986aeacd2ee63a648ae2dcc6db # v1.0.0
        with:
          os: ${{ inputs.os_name }}
          programming-language: Java
          language-version: ${{ inputs.java_version }}
          notifications-channel: 'ecosystem-ci-notifications'
          slack-api-key: ${{ secrets.SLACK_BOT_TOKEN }}
