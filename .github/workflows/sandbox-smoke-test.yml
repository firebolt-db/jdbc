name: Sandbox smoke test

on:
  workflow_dispatch:
    inputs:
      jdbcJar:
        description: 'JDBC jar version (e.g: firebolt-jdbc-3.5.1.jar)'
        required: false
        type: string
        default: 'firebolt-jdbc-3.6.0.jar'
      runId:
        description: 'The run id of the workflow that created the artifact'
        required: true
        type: string
  workflow_call:
    inputs:
      jdbcJar:
        description: 'JDBC jar version (e.g: firebolt-jdbc-3.5.1.jar)'
        required: false
        type: string
        default: 'firebolt-jdbc-3.6.0.jar'
      runId:
        description: 'The run id of the workflow that created the artifact'
        required: true
        type: string

permissions: {}

jobs:
  run-jdbc-jar:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read # Downloads the jar artifact from the given run.

    steps:
      - name: Install java
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: 'zulu'
          java-version: '11'

      # check out only the SmokeTests class
      - name: Download smoke test file
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            src/integrationTest/resources/SmokeTest.java
          sparse-checkout-cone-mode: false
          persist-credentials: false

      - name: Download artifact
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: ${{ inputs.jdbcJar }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: ${{ inputs.runId }}

      - name: Compile class
        env:
          JDBC_JAR: ${{ inputs.jdbcJar }}
        run: javac -cp "$JDBC_JAR" src/integrationTest/resources/SmokeTest.java

      - name: Run class
        env:
          JDBC_JAR: ${{ inputs.jdbcJar }}
        run: java -cp "$JDBC_JAR":src/integrationTest/resources/. SmokeTest