name: Run integration tests v2

on:
  workflow_dispatch:
    inputs:
      database:
        description: 'Database override'
        required: false
        default: ''
      engine:
        description: 'Engine override'
        required: false
      account:
        description: 'Account override'
        required: false
        type: string
      java_version:
        description: 'JRE version'
        required: false
        type: string
        default: '11'
      os_name:
        description: 'The operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
      sendSlackNotifications:
        description: 'Send Slack notifications on failure'
        required: false
        type: boolean
        default: false
      use-cache:
        description: 'Use the Gradle cache (the release path passes false)'
        required: false
        type: boolean
        default: true
  workflow_call:
    inputs:
      database:
        description: 'Database override'
        required: false
        default: ''
        type: string
      engine:
        description: 'Engine override'
        required: false
        type: string
      account:
        description: 'Account override'
        required: false
        type: string
      java_version:
        description: 'Java'
        required: false
        type: string
        default: '11'
      os_name:
        description: 'Operating system'
        required: false
        type: string
        default: 'ubuntu-latest'
      sendSlackNotifications:
        description: 'Send Slack notifications on failure'
        required: false
        type: boolean
        default: false
      use-cache:
        description: 'Use the Gradle cache (the release path passes false)'
        required: false
        type: boolean
        default: true
    secrets:
      FIREBOLT_CLIENT_ID_STG_NEW_IDN:
        required: true
      FIREBOLT_CLIENT_SECRET_STG_NEW_IDN:
        required: true
      ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_ID_STG:
        required: true
      ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_SECRET_STG:
        required: true
      ECOSYSTEM_FIREBOLT_SA_NETWORK_POLICY_CLIENT_ID_STG:
        required: true
      ECOSYSTEM_FIREBOLT_SA_NETWORK_POLICY_CLIENT_SECRET_STG:
        required: true
      SLACK_BOT_TOKEN:
        required: false

permissions: {}

jobs:
  run-integration-tests:
    runs-on: ${{ inputs.os_name }}
    permissions:
      contents: write # Allure report is pushed to gh-pages.
      pages: read # Allure report looks up the Pages URL.
      statuses: write # Allure report posts a commit status.
    steps:
      - name: Validate database and engine
        if: ${{ (inputs.database == '') != (inputs.engine == '') }}
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            core.setFailed("Database and Engine parameters should be provided simultaneously")

      - name: Resolve account
        id: set-account
        shell: bash  # use bash across all OSs
        env:
          INPUT_ACCOUNT: ${{ inputs.account }}
          DEFAULT_ACCOUNT: ${{ vars.FIREBOLT_ACCOUNT }}
        run: |
          if ! [[ -z "$INPUT_ACCOUNT" ]]; then
            echo "account=$INPUT_ACCOUNT" >> "$GITHUB_OUTPUT"
            echo "account=$INPUT_ACCOUNT"
          else
            echo "account=$DEFAULT_ACCOUNT" >> "$GITHUB_OUTPUT"
            echo "account=$DEFAULT_ACCOUNT"
          fi

      - name: Check out code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Prepare java
        uses: actions/setup-java@b843ebf9b913146b38da2eaa7aeddf76074ae1ad # v6.1.0
        with:
          distribution: 'zulu'
          java-version: ${{ inputs.java_version }}

      - name: Setup Gradle
        # Stay on v5: v6 changed the caching licence; see .github/dependabot.yml before bumping.
        uses: gradle/actions/setup-gradle@0723195856401067f7a2779048b490ace7a47d7c # v5.0.2
        with:
          cache-disabled: ${{ !inputs.use-cache }}
          # only allow the master branch to write to the cache
          cache-read-only: ${{ github.ref != 'refs/heads/master' }}

      # for ubuntu-latest , java 11 it will create u11. For windows-latest java 17 it will create w17
      - name: Reduce db suffix name
        id: dbsuffix
        shell: bash
        env:
          OS_NAME: ${{ inputs.os_name }}
          JAVA_VERSION: ${{ inputs.java_version }}
        run: |
          OS_PREFIX=$(echo "$OS_NAME" | cut -c1)
          DB_SUFFIX="${OS_PREFIX}${JAVA_VERSION}"
          echo "DB_SUFFIX=$DB_SUFFIX"
          echo "db_suffix=$DB_SUFFIX" >> "$GITHUB_OUTPUT"

      - name: Setup database and engine
        id: setup
        if: ${{ inputs.database == '' }}
        uses: firebolt-db/integration-testing-setup@1feb289e8da573c5f1f74d8ff3cd69bcb5b5891a # v1.0.4
        with:
          firebolt-client-id: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          firebolt-client-secret: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
          account: ${{ steps.set-account.outputs.account }}
          api-endpoint: "api.staging.firebolt.io"
          db_suffix: ${{ steps.dbsuffix.outputs.db_suffix }}

      - name: Determine database name
        id: find-database-name
        shell: bash  # use bash across all OSs
        env:
          INPUT_DATABASE: ${{ inputs.database }}
          SETUP_DATABASE: ${{ steps.setup.outputs.database_name }}
        run: |
          if ! [[ -z "$INPUT_DATABASE" ]]; then
             echo "database_name=$INPUT_DATABASE" >> "$GITHUB_OUTPUT"
          else
             echo "database_name=$SETUP_DATABASE" >> "$GITHUB_OUTPUT"
          fi

      - name: Determine engine name
        id: find-engine-name
        shell: bash  # use bash across all OSs
        env:
          INPUT_ENGINE: ${{ inputs.engine }}
          SETUP_ENGINE: ${{ steps.setup.outputs.engine_name }}
        run: |
          if ! [[ -z "$INPUT_ENGINE" ]]; then
             echo "engine_name=$INPUT_ENGINE" >> "$GITHUB_OUTPUT"
          else
             echo "engine_name=$SETUP_ENGINE" >> "$GITHUB_OUTPUT"
          fi

      - name: Grant execute permission (Unix)
        if: runner.os != 'Windows'
        run: chmod +x gradlew

      - name: Run integration tests
        shell: bash  # use bash across all OSs
        env:
          FIREBOLT_SA_NO_USER_CLIENT_ID: ${{ secrets.ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_ID_STG }}
          FIREBOLT_SA_NO_USER_CLIENT_SECRET: ${{ secrets.ECOSYSTEM_FIREBOLT_SA_NO_USER_CLIENT_SECRET_STG }}
          FIREBOLT_SA_NETWORK_POLICY_CLIENT_ID: ${{ secrets.ECOSYSTEM_FIREBOLT_SA_NETWORK_POLICY_CLIENT_ID_STG }}
          FIREBOLT_SA_NETWORK_POLICY_CLIENT_SECRET: ${{ secrets.ECOSYSTEM_FIREBOLT_SA_NETWORK_POLICY_CLIENT_SECRET_STG }}
          # build.gradle passes these to the tests as the client_id/client_secret system properties.
          FIREBOLT_CLIENT_ID: ${{ secrets.FIREBOLT_CLIENT_ID_STG_NEW_IDN }}
          FIREBOLT_CLIENT_SECRET: ${{ secrets.FIREBOLT_CLIENT_SECRET_STG_NEW_IDN }}
          DATABASE_NAME: ${{ steps.find-database-name.outputs.database_name }}
          ENGINE_NAME: ${{ steps.find-engine-name.outputs.engine_name }}
          ACCOUNT_NAME: ${{ steps.set-account.outputs.account }}
          V2_GENERATE_SERIES_MAX_SIZE: ${{ vars.V2_GENERATE_SERIES_MAX_SIZE }}
        run: ./gradlew integrationTest -Ddb="$DATABASE_NAME" -Denv="staging" -Daccount="$ACCOUNT_NAME" -Dengine="$ENGINE_NAME" -DincludeTags="v2" -Dv2GenerateSeriesMaxSize="$V2_GENERATE_SERIES_MAX_SIZE" -DintegrationTestMaxHeap=3g

      - name: Upload integration test reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: integrationTest-reports-${{ inputs.os_name }}-java${{ inputs.java_version }}
          path: |
            build/reports/tests/integrationTest
            build/test-results/integrationTest
            build/reports/problems
            build/reports/tests/test
            build/test-results/test
          if-no-files-found: warn
          retention-days: 4

      # Collect logs into workspace (Linux/macOS)
      - name: Collect Gradle logs (unix)
        if: always() && runner.os != 'Windows'
        shell: bash
        run: |
          mkdir -p build/ci-logs/gradle
          cp ~/.gradle/daemon/*/*.log build/ci-logs/gradle 2>/dev/null || true
          find . -type f \( -name 'hs_err_pid*.log' -o -name 'replay_pid*.log' \) -exec cp {} build/ci-logs \; 2>/dev/null || true

      # Collect logs into workspace (Windows)
      - name: Collect Gradle logs (windows)
        if: always() && runner.os == 'Windows'
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\ci-logs\gradle | Out-Null
          Get-ChildItem -Path $env:USERPROFILE\.gradle\daemon\*\*.log -ErrorAction SilentlyContinue | Copy-Item -Destination build\ci-logs\gradle -ErrorAction SilentlyContinue
          Get-ChildItem -Path . -Recurse -Include hs_err_pid*.log,replay_pid*.log -ErrorAction SilentlyContinue | Copy-Item -Destination build\ci-logs -ErrorAction SilentlyContinue

      - name: Allure Report
        uses: firebolt-db/action-allure-report@39037f1a56d995af294067c7c5ceb5713c407274 # v2.1.2
        if: always() && runner.os == 'Linux' && inputs.java_version != '11' # Skip Allure on Java 11
        continue-on-error: true # FIR-48984
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          pages-branch: gh-pages
          mapping-json: |
            {
              "build/allure-results": "integration_v2"
            }

      - name: Slack Notify of failure
        if: failure() && inputs.sendSlackNotifications
        uses: firebolt-db/action-slack-nightly-notify@1bdd915837fbe0986aeacd2ee63a648ae2dcc6db # v1.0.0
        with:
          os: ${{ inputs.os_name }}
          programming-language: Java
          language-version: ${{ inputs.java_version }}
          notifications-channel: 'ecosystem-ci-notifications'
          slack-api-key: ${{ secrets.SLACK_BOT_TOKEN }}
